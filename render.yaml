services:
  - type: web
    name: frag-naija-support-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Application Settings
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: true
        
      # Database Configuration (Neon)
      - key: DATABASE_URL
        sync: false
        
      # Qdrant Cloud Configuration
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: support_knowledge
        
      # LLM Provider (Groq)
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT
        value: 30.0
      - key: GROQ_MAX_RETRIES
        value: 3
        
      # Embeddings & Retrieval
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSION
        value: 384
      - key: RETRIEVAL_CANDIDATE_K
        value: 10
      - key: RETRIEVAL_FINAL_K
        value: 3
      - key: RERANKER_ENABLED
        value: false
        
      # Observability (Langfuse)
      - key: LANGFUSE_ENABLED
        value: true
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
        
      # Security & CORS
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
        
      # Session & History
      - key: MAX_HISTORY_TURNS
        value: 10
      - key: MAX_HISTORY_TOKENS
        value: 2000
        
      # Knowledge Management
      - key: KNOWLEDGE_STALE_DAYS
        value: 30
      - key: KNOWLEDGE_PRIORITY_MAP
        value: document:1,website:2,faq:3,article:4